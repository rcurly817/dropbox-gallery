---
- name: Eigenständige Bildarchivierung auf dem Asustor NAS
  hosts: localhost  # Wir führen es direkt lokal auf dem Pi aus
  gather_facts: false

  vars:
    nas_mount_punkt: "/mnt/asustor"
    pi_quell_ordner: "/opt/dropbox-download"

  tasks:
    - name: 1. Prüfen, ob der NAS-Mountpunkt existiert und erreichbar ist
      ansible.builtin.stat:
        path: "{{ nas_mount_punkt }}"
      register: mount_check

    - name: Abbrechen, falls der NAS-Ordner fehlt
      ansible.builtin.meta: end_play
      when: not mount_check.stat.exists

    - name: 2. Bestehende JPGs auf das NAS kopieren (Duplikate überspringen)
      ansible.builtin.shell: >
        find "{{ pi_quell_ordner }}" -type f \( -iname "*.jpg" -o -iname "*.jpeg" \) | while read -r foto; do
          cp -n "$foto" "{{ nas_mount_punkt }}/";
        done
      register: jpg_res
      changed_when: false

    - name: 3. HEIC-Bilder prüfen, konvertieren und direkt auf dem NAS speichern
      ansible.builtin.shell: >
        find "{{ pi_quell_ordner }}" -type f -iname "*.heic" | while read -r foto; do
          dateiname=$(basename "$foto" | sed 's/\.[^.]*$//');
          if [ ! -f "{{ nas_mount_punkt }}/$dateiname.jpg" ]; then
            convert "$foto" "{{ nas_mount_punkt }}/$dateiname.jpg";
          fi
        done
      register: heic_res
      changed_when: false
