---
- name: Eigenständige Bildarchivierung auf dem Asustor NAS
  hosts: localhost
  gather_facts: false

  vars:
    nas_mount_punkt: "/mnt/asustor"
    pi_quell_ordner: "/opt/dropbox-download"

  tasks:
    - name: 1. Prüfen, ob der NAS-Mountpunkt existiert und erreichbar ist
      ansible.builtin.stat:
        path: "{{ nas_mount_punkt }}"
      register: mount_check

    - name: Abbrechen, falls der NAS-Ordner fehlt
      ansible.builtin.meta: end_play
      when: not mount_check.stat.exists

    - name: 2. Bestehende JPGs auf das NAS kopieren (NUR Hauptordner, Duplikate überspringen)
      ansible.builtin.shell: |
        find "{{ pi_quell_ordner }}" -maxdepth 1 -type f \( -iname "*.jpg" -o -iname "*.jpeg" \) | while read -r foto; do
          cp -n "$foto" "{{ nas_mount_punkt }}/";
        done
      register: jpg_res
      changed_when: false

    - name: 3. HEIC-Bilder direkt auf dem NAS als JPG speichern
      ansible.builtin.shell: |
        find "{{ pi_quell_ordner }}" -maxdepth 1 -type f -iname "*.heic" | while read -r foto; do
          dateiname=$(basename "$foto" | sed 's/\.[^.]*$//');
          ziel_datei="{{ nas_mount_punkt }}/$dateiname.jpg"
          
          # Falls eine korrupte oder 0-Byte-Datei existiert, löschen
          if [ -f "$ziel_datei" ] && [ ! -s "$ziel_datei" ]; then
            rm -f "$ziel_datei";
          fi
          
          # Direkt auf dem NAS konvertieren, falls das JPG fehlt
          if [ ! -f "$ziel_datei" ]; then
            convert "$foto" "$ziel_datei";
          fi
        done
      become: true
      register: heic_res
      changed_when: false
